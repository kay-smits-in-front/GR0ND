[project]
name = "gr0nd"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "psycopg[binary,pool]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyproj>=3.8.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
