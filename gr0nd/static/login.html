<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GR0ND</title>
    <link rel="stylesheet" href="/static/stijl.css" />
  </head>
  <body>
    <div class="helft bruin"></div>
    <div class="helft blauw"></div>
    <div class="naad"></div>
    <div class="korrel"></div>
    <main class="midden">
      <form method="post" action="/login">
        <h1>GR0ND<small>Empowered by In-front</small></h1>
        <label class="verborgen" for="email">E-mail</label>
        <input id="email" type="email" name="email" placeholder="E-mail" autocomplete="username" required autofocus />
        <label class="verborgen" for="wachtwoord">Wachtwoord</label>
        <input
          id="wachtwoord"
          type="password"
          name="wachtwoord"
          placeholder="Wachtwoord"
          autocomplete="current-password"
          required
        />
        <button type="submit">Inloggen</button>
      </form>
    </main>
  </body>
</html>
