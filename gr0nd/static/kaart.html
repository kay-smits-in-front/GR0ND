<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GR0ND | Kaart</title>
    <link rel="stylesheet" href="/static/stijl.css" />
    <link rel="stylesheet" href="/static/vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="/static/kaart.css" />
    <script src="/static/vendor/maplibre-gl.js" defer></script>
    <script src="/static/kaart.js" defer></script>
  </head>
  <body class="app">
    <header class="balk">
      <span class="merk-klein">GR0ND</span>
      <nav class="tabs" aria-label="Weergave">
        <button id="tab-overzicht" type="button" aria-pressed="true">Overzicht</button>
        <button id="tab-zicht" type="button" aria-pressed="false" disabled>0-zicht</button>
      </nav>
      <p id="balk-info" class="balk-info">Voorbeelddata: grond, bovengrond en leidingen zijn nog niet echt.</p>
    </header>

    <main class="werk">
      <aside id="paneel-overzicht" class="links">
        <section class="paneel">
          <h2>Gebied</h2>
          <div class="knoppen">
            <button id="teken-gebied" type="button" aria-pressed="false">Teken gebied</button>
            <button id="wis-gebied" type="button" disabled>Wis gebied</button>
          </div>
          <p id="gebied-info" class="zacht">Klik punten op de kaart. Dubbelklik om af te ronden.</p>
        </section>
        <section class="paneel">
          <h2>Tracé</h2>
          <div class="knoppen">
            <button id="teken-trace" type="button" aria-pressed="false">Teken tracé</button>
            <button id="klaar-trace" type="button" disabled>Klaar</button>
            <button id="laatste-punt" type="button" disabled>Laatste punt weg</button>
            <button id="wis-trace" type="button" disabled>Wis tracé</button>
          </div>
          <p id="trace-info" class="zacht">Kies Teken tracé en klik de route op de kaart, ook met bochten.</p>
          <button id="open-zicht" type="button" class="hoofd" disabled>Open 0-zicht</button>
        </section>
        <section class="paneel">
          <h2>Achtergrond</h2>
          <div id="achtergronden" class="keuzes"></div>
        </section>
        <section class="paneel">
          <h2>Lagen</h2>
          <div id="lagen" class="keuzes"></div>
          <h3 class="zacht-kop">Volgt nog</h3>
          <ul id="lagen-volgt" class="volgt"></ul>
        </section>
      </aside>

      <aside id="paneel-zicht" class="links links-zicht" hidden>
        <section class="paneel tools">
          <h2>Tools</h2>
          <div id="tools" class="tools-lijst"></div>
          <button id="herstel" type="button">Herstel zicht</button>
        </section>
        <section class="paneel checklist">
          <h2>Checklist <span id="checklist-teller" class="zacht"></span></h2>
          <ul id="checklist"></ul>
        </section>
      </aside>

      <section id="vlak" class="werkvlak">
        <div id="kaart" aria-label="Kaart van Nederland"></div>
        <form id="zoek-form" class="zoek" role="search" autocomplete="off">
          <label for="zoek-invoer" class="verborgen">Zoek een locatie</label>
          <input id="zoek-invoer" type="search" placeholder="Zoek adres, plaats of postcode" />
          <ul id="zoek-lijst" class="zoek-lijst" hidden></ul>
        </form>
        <canvas id="zicht" aria-label="0-zicht: doorsnede loodrecht op het tracé" hidden></canvas>
        <div id="meldingen" class="meldingen" aria-live="polite"></div>
        <div id="toasts" class="toasts" aria-live="assertive"></div>
        <p id="status" class="status"></p>
        <div id="positie" class="positie" hidden>
          <label for="positie-schuif">Positie langs het tracé</label>
          <input id="positie-schuif" type="range" min="0" max="100" step="1" value="0" list="knikken" />
          <datalist id="knikken"></datalist>
          <output id="positie-waarde"></output>
        </div>
      </section>
    </main>
  </body>
</html>
